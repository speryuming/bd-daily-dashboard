services:
  - type: web
    name: fuquan-rectification
    runtime: python
    rootDir: rectification-system
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --host 0.0.0.0
    healthCheckPath: /api/version
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RECTIFICATION_DATA_DIR
        value: /tmp/rectification-data
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
